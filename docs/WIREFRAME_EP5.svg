<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
  <style>
    .bg{fill:#f5f7f9}.panel{fill:#fff;stroke:#9aa7b2;stroke-width:2}.head{fill:#0f2c4c}
    .filter{fill:#edf6f5;stroke:#0e8c84;stroke-width:2}.accent{fill:#0e8c84}
    .title{font:700 28px Arial;fill:#fff}.h2{font:700 18px Arial;fill:#0f2c4c}
    .body{font:15px Arial;fill:#405264}.small{font:13px Arial;fill:#52606d}
    .card{fill:#fff;stroke:#0e8c84;stroke-width:2}.line{stroke:#0e8c84;stroke-width:4;fill:none}
    .bar{fill:#1f77b4}.alert{fill:#ff7f0e}.meta{stroke:#c8860d;stroke-width:3;stroke-dasharray:8 6}
  </style>
  <rect class="bg" width="1400" height="980"/>
  <rect class="head" x="30" y="25" width="1340" height="75" rx="10"/>
  <text class="title" x="60" y="72">DataRetail 360 · Ventas e inventario</text>
  <rect class="filter" x="30" y="120" width="1340" height="65" rx="8"/>
  <text class="h2" x="55" y="150">Filtros:</text><text class="body" x="135" y="150">Período  |  Región  |  Canal  |  Categoría</text>
  <text class="small" x="55" y="172">Los filtros vacíos incluyen todos los valores · stock = último snapshot</text>

  <g transform="translate(30,205)">
    <rect class="card" width="250" height="105" rx="8"/><rect class="accent" width="8" height="105" rx="4"/>
    <text class="h2" x="24" y="34">Venta neta</text><text class="body" x="24" y="68">Valor + variación interanual</text>
  </g>
  <g transform="translate(302,205)"><rect class="card" width="250" height="105" rx="8"/><rect class="accent" width="8" height="105" rx="4"/><text class="h2" x="24" y="34">Crecimiento</text><text class="body" x="24" y="68">Meta ≥ 0%</text></g>
  <g transform="translate(574,205)"><rect class="card" width="250" height="105" rx="8"/><rect class="accent" width="8" height="105" rx="4"/><text class="h2" x="24" y="34">Devoluciones</text><text class="body" x="24" y="68">Meta ≤ 2%</text></g>
  <g transform="translate(846,205)"><rect class="card" width="250" height="105" rx="8"/><rect class="accent" width="8" height="105" rx="4"/><text class="h2" x="24" y="34">Quiebre stock</text><text class="body" x="24" y="68">Meta ≤ 5%</text></g>
  <g transform="translate(1118,205)"><rect class="card" width="252" height="105" rx="8"/><rect class="accent" width="8" height="105" rx="4"/><text class="h2" x="24" y="34">Disponibilidad</text><text class="body" x="24" y="68">Meta ≥ 90%</text></g>

  <rect class="panel" x="30" y="335" width="830" height="260" rx="8"/>
  <text class="h2" x="55" y="370">Evolución mensual de venta neta</text>
  <path class="line" d="M80 535 L190 490 L300 505 L410 430 L520 455 L630 390 L745 420 L820 375"/>
  <text class="small" x="55" y="575">Línea temporal · etiquetas y tooltip con CLP</text>
  <rect class="panel" x="885" y="335" width="485" height="260" rx="8"/>
  <text class="h2" x="910" y="370">Venta neta por categoría</text>
  <rect class="bar" x="1010" y="400" width="290" height="32"/><rect class="bar" x="1010" y="455" width="240" height="32"/><rect class="bar" x="1010" y="510" width="195" height="32"/>
  <text class="small" x="910" y="421">Tecnología</text><text class="small" x="910" y="476">Accesorios</text><text class="small" x="910" y="531">Hogar</text>

  <rect class="filter" x="30" y="620" width="1340" height="100" rx="8"/>
  <text class="h2" x="55" y="652">Storytelling SCI</text>
  <text class="body" x="55" y="680">Situación: resultado del período · Complicación: comparación y guardrail · Decisión: prioridad de reposición</text>
  <text class="small" x="55" y="705">La recomendación no atribuye causalidad sin análisis adicional.</text>

  <rect class="panel" x="30" y="745" width="650" height="205" rx="8"/>
  <text class="h2" x="55" y="780">Quiebre diario y meta</text>
  <line class="meta" x1="75" y1="830" x2="640" y2="830"/><path class="line" d="M75 890 L180 850 L285 870 L390 815 L500 845 L625 805"/>
  <text class="small" x="75" y="925">Tendencia de snapshots, sin sumar fechas</text>
  <rect class="panel" x="705" y="745" width="665" height="205" rx="8"/>
  <text class="h2" x="730" y="780">Detalle: región → sucursal → producto</text>
  <rect class="alert" x="735" y="810" width="180" height="26"/><rect class="bar" x="735" y="850" width="290" height="26"/><rect class="accent" x="735" y="890" width="390" height="26"/>
  <text class="small" x="1160" y="925">Tabla crítica</text>
</svg>
